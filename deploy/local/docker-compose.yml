# The whole product on one machine: guard-runtime (policy, capability check, protected execution, read-back) and
# app (backend API + dashboard). First run: ./init-env.sh (writes .env with fresh secrets), then:
#   docker compose up --build
# Dashboard: http://localhost:8088 (user "operator", password OPERATOR_PASSWORD in .env). MCP: http://localhost:8088/mcp
#
# Local development only: the services talk plain HTTP on the private compose network and guard-runtime may call the
# app's first-party security adapter over HTTP (GUARD_RUNTIME_ALLOW_INSECURE_HTTP). Production needs HTTPS endpoints
# and that flag off.
name: privacy-guard-local

services:
  guard-runtime:
    build: ../../guard-runtime
    environment:
      # Versions published from the dashboard live in the data volume; policy.json only seeds versions not seen yet.
      GUARD_RUNTIME_POLICY_FILE: /config/policy.json
      GUARD_RUNTIME_POLICY_DIR: /data/policy
      GUARD_RUNTIME_REPLAY_FILE: /data/replay/execution-nonces.json
      GUARD_RUNTIME_ACTIVITY_FILE: /data/activity/activity.jsonl
      GUARD_RUNTIME_TENANT_ID: ${GUARD_RUNTIME_TENANT_ID:-local}
      GUARD_RUNTIME_CALLERS_JSON: >-
        [{"id":"agent:proposal","token":"${GUARD_RUNTIME_PROPOSAL_TOKEN:?run ./init-env.sh first}","functions":["evaluate-action"]},
        {"id":"agent:executor","token":"${GUARD_RUNTIME_EXECUTOR_TOKEN:?run ./init-env.sh first}","functions":["execute-remediation","verify-remediation"]},
        {"id":"agent:policy-admin","token":"${GUARD_RUNTIME_POLICY_ADMIN_TOKEN:?run ./init-env.sh first}","functions":["manage-policy"]}]
      GUARD_RUNTIME_VERIFIED_EMAIL: ${GUARD_RUNTIME_VERIFIED_EMAIL:-soc@example.test}
      GUARD_RUNTIME_ALLOW_INSECURE_HTTP: "true"
      SECURITY_API_URL: http://app:8080/api/security/remediation/execute
      SECURITY_VERIFICATION_URL: http://app:8080/api/security/remediation/verify
      SECURITY_API_KEY: ${SECURITY_API_KEY:?run ./init-env.sh first}
      REMEDIATION_AUTH_KEY_ID: primary
      REMEDIATION_AUTH_PUBLIC_KEY_SPKI: ${REMEDIATION_AUTH_PUBLIC_KEY_SPKI:?run ./init-env.sh first}
    volumes:
      - ./policy.json:/config/policy.json:ro
      - guard-runtime-data:/data

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:h2:file:/data/privacyguard;AUTO_SERVER=TRUE
      GUARD_RUNTIME_URL: http://guard-runtime:3101
      GUARD_RUNTIME_PROPOSAL_TOKEN: ${GUARD_RUNTIME_PROPOSAL_TOKEN:?run ./init-env.sh first}
      GUARD_RUNTIME_EXECUTOR_TOKEN: ${GUARD_RUNTIME_EXECUTOR_TOKEN:?run ./init-env.sh first}
      GUARD_RUNTIME_POLICY_ADMIN_TOKEN: ${GUARD_RUNTIME_POLICY_ADMIN_TOKEN:?run ./init-env.sh first}
      SECURITY_API_KEY: ${SECURITY_API_KEY:?run ./init-env.sh first}
      REMEDIATION_AUTH_PRIVATE_KEY_PKCS8: ${REMEDIATION_AUTH_PRIVATE_KEY_PKCS8:?run ./init-env.sh first}
      REMEDIATION_AUTH_KEY_ID: primary
      AUDIT_INTEGRITY_KEY: ${AUDIT_INTEGRITY_KEY:?run ./init-env.sh first}
      OPERATOR_USERNAME: operator
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?run ./init-env.sh first}
      SESSION_COOKIE_SECURE: "false"
      MCP_TOKEN: ${MCP_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_API_URL: ${AI_API_URL:-https://api.openai.com/v1/chat/completions}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_ALLOW_INSECURE_HTTP: ${AI_ALLOW_INSECURE_HTTP:-false}
    ports:
      - "${DASHBOARD_PORT:-8088}:8080"
    volumes:
      - app-data:/data
    depends_on:
      - guard-runtime

volumes:
  guard-runtime-data:
  app-data:
