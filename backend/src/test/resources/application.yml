spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:privacyguard-test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: false
privacy-guard:
  gateway:
    base-url: http://localhost:3001
    service-token: test-gateway-service-token-1234567890
  audit-integrity:
    key: test-audit-integrity-key-12345678901234567890
    key-id: test-primary
    previous-keys: ""
    allow-legacy-bootstrap: false
  operator:
    username: test-operator
    password: test-password
    cookie-secure: false
  incident-retention:
    days: 7
    purge-initial-delay-ms: 86400000
    purge-interval-ms: 86400000
