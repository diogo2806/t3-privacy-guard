spring:
  datasource:
    url: jdbc:h2:mem:privacyguard-test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: false
privacy-guard:
  guard-runtime:
    url: http://localhost:3101
    proposal-token: test-runtime-proposal-token-1234567890
    executor-token: test-runtime-executor-token-1234567890
  mcp:
    token: test-mcp-token-123456789012345678901234
  remediation-capability:
    private-key-pkcs8: MC4CAQAwBQYDK2VwBCIEIAv4OIfbF/R/i9uL6wgRalq2gperSKNx+Ig9BuS9L4qS
    ttl-seconds: 60
  audit-integrity:
    key: test-audit-integrity-key-12345678901234567890
    key-id: test-primary
    previous-keys: ""
    allow-legacy-bootstrap: false
  operator:
    username: test-operator
    password: test-password
    cookie-secure: false
  incident-retention:
    days: 7
    purge-initial-delay-ms: 86400000
    purge-interval-ms: 86400000
