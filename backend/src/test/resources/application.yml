spring:
  datasource:
    url: jdbc:h2:mem:privacyguard-test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: false
privacy-guard:
  gateway:
    base-url: http://localhost:3001
    service-token: test-gateway-service-token-1234567890
  remediation-capability:
    key: test-remediation-capability-key-1234567890
    ttl-seconds: 60
  operator:
    username: test-operator
    password: test-password
    cookie-secure: false
