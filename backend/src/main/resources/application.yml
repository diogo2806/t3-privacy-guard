spring:
  application:
    name: t3-privacy-guard-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:/data/privacyguard;AUTO_SERVER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  servlet:
    session:
      timeout: ${OPERATOR_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
privacy-guard:
  gateway:
    base-url: ${T3N_GATEWAY_URL:http://t3n-gateway:3001}
    service-token: ${GATEWAY_SERVICE_TOKEN:}
  remediation-capability:
    key: ${REMEDIATION_CAPABILITY_KEY:}
    ttl-seconds: ${REMEDIATION_CAPABILITY_TTL_SECONDS:60}
  operator:
    username: ${OPERATOR_USERNAME:}
    password: ${OPERATOR_PASSWORD:}
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
  incident-retention:
    days: ${INCIDENT_RETENTION_DAYS:7}
    purge-initial-delay-ms: ${INCIDENT_PURGE_INITIAL_DELAY_MS:60000}
    purge-interval-ms: ${INCIDENT_PURGE_INTERVAL_MS:900000}
  evidence:
    manifest-path: ${EVIDENCE_MANIFEST_PATH:../docs/evidence/deployment-manifest.json}
    testnet-path: ${EVIDENCE_TESTNET_PATH:../docs/evidence/testnet-run.json}
