spring:
  application:
    name: t3-privacy-guard-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:/data/privacyguard;AUTO_SERVER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      # H2 (evaluation and the local stack) keeps the schema in step with the entities. Production on PostgreSQL uses
      # the "postgres" profile: versioned Flyway migrations and validation instead.
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false
server:
  servlet:
    session:
      timeout: ${OPERATOR_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        # Becomes lax automatically when single sign-on is on, so the identity provider's redirect back keeps the session.
        same-site: ${SESSION_COOKIE_SAME_SITE:strict}
        secure: ${SESSION_COOKIE_SECURE:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
privacy-guard:
  guard-runtime:
    url: ${GUARD_RUNTIME_URL:http://guard-runtime:3101}
    proposal-agent-id: ${GUARD_RUNTIME_PROPOSAL_AGENT_ID:agent:proposal}
    proposal-token: ${GUARD_RUNTIME_PROPOSAL_TOKEN:}
    executor-id: ${GUARD_RUNTIME_EXECUTOR_ID:agent:executor}
    executor-token: ${GUARD_RUNTIME_EXECUTOR_TOKEN:}
    # Optional caller granted only manage-policy; without it the dashboard shows the policy read-only.
    policy-admin-token: ${GUARD_RUNTIME_POLICY_ADMIN_TOKEN:}
    timeout-ms: ${GUARD_RUNTIME_TIMEOUT_MS:15000}
  ai:
    provider: ${AI_PROVIDER:disabled}
    api-url: ${AI_API_URL:https://api.openai.com/v1/chat/completions}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    allow-insecure-http: ${AI_ALLOW_INSECURE_HTTP:false}
  mcp:
    # Bearer token for /mcp. Empty disables the MCP endpoint.
    token: ${MCP_TOKEN:}
  security-remediation:
    api-key: ${SECURITY_API_KEY:}
  remediation-capability:
    private-key-pkcs8: ${REMEDIATION_AUTH_PRIVATE_KEY_PKCS8:}
    key-id: ${REMEDIATION_AUTH_KEY_ID:primary}
    ttl-seconds: ${REMEDIATION_CAPABILITY_TTL_SECONDS:60}
  audit-integrity:
    key: ${AUDIT_INTEGRITY_KEY:}
    key-id: ${AUDIT_INTEGRITY_KEY_ID:primary}
    previous-keys: ${AUDIT_INTEGRITY_PREVIOUS_KEYS:}
    allow-legacy-bootstrap: ${AUDIT_INTEGRITY_ALLOW_LEGACY_BOOTSTRAP:false}
  operator:
    username: ${OPERATOR_USERNAME:}
    password: ${OPERATOR_PASSWORD:}
    cookie-secure: ${SESSION_COOKIE_SECURE:true}
  iam:
    enterprise-sod-enabled: ${ENTERPRISE_SOD_ENABLED:false}
    analyst:
      username: ${ANALYST_USERNAME:}
      password: ${ANALYST_PASSWORD:}
    approver:
      username: ${APPROVER_USERNAME:}
      password: ${APPROVER_PASSWORD:}
    executor:
      username: ${EXECUTOR_USERNAME:}
      password: ${EXECUTOR_PASSWORD:}
    auditor:
      username: ${AUDITOR_USERNAME:}
      password: ${AUDITOR_PASSWORD:}
    # Optional fifth account allowed to publish and roll back policy versions.
    policy-admin:
      username: ${POLICY_ADMIN_USERNAME:}
      password: ${POLICY_ADMIN_PASSWORD:}
  sso:
    # OpenID Connect single sign-on (Entra ID, Okta, Keycloak, Google...). Empty issuer keeps it off.
    issuer-uri: ${OIDC_ISSUER_URI:}
    client-id: ${OIDC_CLIENT_ID:}
    client-secret: ${OIDC_CLIENT_SECRET:}
    scopes: ${OIDC_SCOPES:openid,profile,email}
    username-claim: ${OIDC_USERNAME_CLAIM:preferred_username}
    # Claim holding the user's groups or roles; a dotted path reaches nested claims (Keycloak: realm_access.roles).
    roles-claim: ${OIDC_ROLES_CLAIM:groups}
    # JSON from Privacy Guard role to the claim values that grant it, e.g. {"ANALYST":["soc-analysts"],"AUDITOR":["auditors"]}
    role-mapping: '${OIDC_ROLE_MAPPING:{}}'
    # false leaves single sign-on as the only way in (no local accounts needed).
    local-login-enabled: ${LOCAL_LOGIN_ENABLED:true}
  incident-intake:
    enabled: ${INCIDENT_INTAKE_ENABLED:false}
    integrations-json: '${INCIDENT_INTAKE_INTEGRATIONS_JSON:[]}'
    credentials-file: ${INCIDENT_INTAKE_CREDENTIALS_FILE:}
  incident-retention:
    days: ${INCIDENT_RETENTION_DAYS:7}
    purge-initial-delay-ms: ${INCIDENT_PURGE_INITIAL_DELAY_MS:60000}
    purge-interval-ms: ${INCIDENT_PURGE_INTERVAL_MS:900000}
