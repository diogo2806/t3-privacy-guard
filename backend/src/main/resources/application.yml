spring:
  application:
    name: t3-privacy-guard-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:/data/privacyguard;AUTO_SERVER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  servlet:
    session:
      timeout: ${OPERATOR_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
privacy-guard:
  gateway:
    base-url: ${T3N_GATEWAY_URL:http://t3n-gateway:3001}
  operator:
    username: ${OPERATOR_USERNAME:}
    password: ${OPERATOR_PASSWORD:}
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
