[package]
name = "privacy-guard-contract"
version = "0.4.5"
edition = "2021"
description = "T3 Privacy Guard policy and secretless-remediation TEE contract"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wit-bindgen = { version = "0.49", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["pkcs8"] }

[dev-dependencies]
proptest = "1.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
